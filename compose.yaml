services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: drone_platform
      POSTGRES_USER: drone_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone_app -d drone_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: